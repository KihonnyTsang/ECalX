[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecalx-agent-portfolio"
version = "0.1.0rc3"
description = "ECalX production-derived Agent core and offline read-only portfolio"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["streamlit>=1.50,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
addopts = "-p no:cacheprovider"

markers = ["task_store: permits only new temporary SQLite task/policy stores"]
